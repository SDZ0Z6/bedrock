[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-cost"
version = "1.0.0"
description = "AWS Bedrock 成本与使用情况监控平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
    # Telegram 告警卡片是画出来的图片（cards.py）
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 生产部署用：gunicorn 只在 Linux 上装得了，本地开发不需要
deploy = ["gunicorn>=22.0"]

[project.scripts]
bedrock-cost = "bedrock_cost.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# static 下不只有 css：图标、logo、loading.mp4、客户头像（static/avatars）都得跟着包走；
# fonts 是画告警卡片用的字体（和各自的 OFL 许可证）
bedrock_cost = ["templates/*.html", "static/*", "static/avatars/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不装包也能跑测试
pythonpath = ["src"]
markers = [
    "integration: 需要真实 AWS 凭证，会调用 Cost Explorer（按请求计费，约 0.01 USD/次）",
]
# 默认只跑不联网的用例；要跑真实 CE 用 pytest -m integration
addopts = "-m 'not integration' -q"
