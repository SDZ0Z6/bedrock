[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-cost"
version = "1.0.0"
description = "AWS Bedrock 成本与使用情况监控平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bedrock-cost = "bedrock_cost.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bedrock_cost = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不装包也能跑测试
pythonpath = ["src"]
markers = [
    "integration: 需要真实 AWS 凭证，会调用 Cost Explorer（按请求计费，约 0.01 USD/次）",
]
# 默认只跑不联网的用例；要跑真实 CE 用 pytest -m integration
addopts = "-m 'not integration' -q"
